<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventFlow | Something Went Wrong</title>
    <link rel="icon" type="image/png" th:href="@{/images/eventflow-favicon.png(v='20260923final')}" href="/images/eventflow-favicon.png?v=20260923final">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css(v='20260923layoutfix3')}" href="/css/site.css?v=20260923layoutfix3">
</head>
<body class="standalone-error-body">
<main class="standalone-error-card">
    <div class="error-symbol"><i class="bi bi-exclamation-triangle"></i></div>
    <span class="section-kicker" th:text="${status != null ? status + ' ERROR' : 'EVENTFLOW'}">EVENTFLOW</span>
    <h1>Something went wrong.</h1>
    <p th:text="${message != null and !#strings.isEmpty(message) ? message : 'The request could not be completed. Return to EventFlow and try again.'}">The request could not be completed.</p>
    <div class="error-actions"><a class="primary-button" th:href="@{/dashboard}"><i class="bi bi-arrow-left"></i>Back to EventFlow</a></div>
</main>
</body>
</html>
